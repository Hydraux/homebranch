services:
  homebranch:
    image: node:20
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
      - node_modules:/workspace/node_modules
    environment:
      DATABASE_HOST: db
      DATABASE_USERNAME: homebranch
      DATABASE_PASSWORD: changeme
      DATABASE_PORT: "5432"
      DATABASE_NAME: homebranch
      NODE_ENV: development
      PORT: "8080"
      CORS_ORIGIN: "*"
      JWT_ACCESS_SECRET: dev_access_secret_change_me
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      APP_URL: http://localhost
      STORAGE_LOCATION: local
    ports:
      - "8080:8080"
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: homebranch
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: homebranch
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homebranch"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: auth
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  homebranch-web:
    image: ghcr.io/oghamark/homebranch-web:latest
    ports:
      - "80:80"
    environment:
      API_BACKEND: http://homebranch:8080
      AUTH_BACKEND: http://auth:3000

  auth:
    image: ghcr.io/oghamark/authentication:latest
    ports:
      - "3001:3000"
    environment:
      DATABASE_HOST: auth-db
      DATABASE_PORT: "5432"
      DATABASE_USERNAME: auth
      DATABASE_PASSWORD: changeme
      DATABASE_NAME: auth
      JWT_ACCESS_SECRET: dev_access_secret_change_me
      JWT_REFRESH_SECRET: dev_refresh_secret_change_me
      SESSION_SECRET: your-session-secret-here
      APP_URL: http://localhost
      CORS_ORIGIN: "*"
      PORT: "3000"
    depends_on:
      auth-db:
        condition: service_healthy

volumes:
  node_modules:
  postgres-data:
  auth-data:
  redis-data:
